name: Waiting for answer.

on:
  issue_comment:
    types: [created]
  schedule:
    - cron: '30 0 * * *'

jobs:
  waiting-for-answer:
    runs-on: ubuntu-slim
    # fork 的 GITHUB_TOKEN 預設唯讀：no-response 要建立／套用 label 並關閉
    # issue，缺 issues: write 就會在 POST /labels 直接 403（實測 2026-10-24）。
    permissions:
      issues: write
      pull-requests: write
    steps:
      - uses: lee-dohm/no-response@v0.5.0
        with:
          token: ${{ github.token }}
          responseRequiredLabel: waiting for answer
